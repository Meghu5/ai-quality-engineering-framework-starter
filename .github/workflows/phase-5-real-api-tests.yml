name: Phase 5 Real API Tests

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  real-api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quality-engineering-framework
    env:
      DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Duffel TEST/SANDBOX integration tests
        if: env.DUFFEL_ACCESS_TOKEN != ''
        run: |
          python -m pytest -m real_api -v --html=reports/duffel-real-api-report.html --self-contained-html

      - name: Skip real API tests without Duffel secret
        if: env.DUFFEL_ACCESS_TOKEN == ''
        run: |
          echo "DUFFEL_ACCESS_TOKEN secret is not configured; skipping Phase 5 real API tests."

      - name: Upload real API report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duffel-real-api-test-report
          path: ai-quality-engineering-framework/reports/
