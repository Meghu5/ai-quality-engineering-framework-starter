name: Phase 7 Security Tests

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  api-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quality-engineering-framework

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start deterministic security target
        run: |
          python -m performance.apps.deterministic_airline_service --host 127.0.0.1 --port 8001 --security-mode &
          echo $! > /tmp/airline-security-service.pid

      - name: Wait for health endpoint
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(20):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8001/health", timeout=2) as response:
                      body = json.loads(response.read().decode("utf-8"))
                  if body.get("status") == "ok":
                      raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("security target did not become healthy")
          PY

      - name: Run Phase 7 API security tests
        run: |
          mkdir -p reports
          python -m pytest -m "security and api" -v --html=reports/security-api-report.html --self-contained-html

      - name: Stop deterministic security target
        if: always()
        run: |
          if [ -f /tmp/airline-security-service.pid ]; then
            kill "$(cat /tmp/airline-security-service.pid)" || true
          fi

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-7-security-api-report
          path: ai-quality-engineering-framework/reports/security-api-report.html

  zap-baseline-optional:
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_ZAP_BASELINE == 'true' }}
    defaults:
      run:
        working-directory: ai-quality-engineering-framework

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start deterministic security target
        run: |
          python -m performance.apps.deterministic_airline_service --host 127.0.0.1 --port 8001 --security-mode &
          echo $! > /tmp/airline-security-service.pid
          sleep 2

      - name: Run optional ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://127.0.0.1:8001"
          cmd_options: "-a -m 1"

      - name: Stop deterministic security target
        if: always()
        run: |
          if [ -f /tmp/airline-security-service.pid ]; then
            kill "$(cat /tmp/airline-security-service.pid)" || true
          fi
