name: Phase 11 Observability

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  observability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quality-engineering-framework

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-observability.txt

      - name: Run observability tests
        env:
          AI_OBSERVABILITY_ENABLED: "false"
        run: python -m pytest tests/observability -v

      - name: Run regression suite with telemetry disabled
        env:
          AI_OBSERVABILITY_ENABLED: "false"
        run: python -m pytest -v
