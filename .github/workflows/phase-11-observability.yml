name: Phase 11 Observability

on:
  workflow_dispatch:
  pull_request:
  push:

jobs:
  observability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quality-engineering-framework

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-observability.txt

      - name: Run observability tests
        env:
          AI_OBSERVABILITY_ENABLED: "false"
        run: python -m pytest tests/observability -v

      - name: Generate Phase 10 evidence
        env:
          AI_OBSERVABILITY_ENABLED: "false"
        run: python -c "from ai_eval.report import write_phase10_report; write_phase10_report()"

      - name: Run CI correlation evidence
        env:
          AI_OBSERVABILITY_ENABLED: "true"
          AI_OBSERVABILITY_EXPORTER: "json"
        run: python -m pytest -p observability.pytest_plugin tests/observability tests/ai_eval -q

      - name: Generate operational observability analysis
        continue-on-error: true
        run: python -m observability.operational_report

      - name: Generate observability readiness diagnostics
        continue-on-error: true
        run: python -m observability.readiness

      - name: Run regression suite with telemetry disabled
        env:
          AI_OBSERVABILITY_ENABLED: "false"
        run: python -m pytest -v

      - name: Upload Phase 11 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-11-observability-evidence
          path: |
            ai-quality-engineering-framework/reports/observability/
            ai-quality-engineering-framework/reports/ai_eval/
            ai-quality-engineering-framework/reports/ci/
