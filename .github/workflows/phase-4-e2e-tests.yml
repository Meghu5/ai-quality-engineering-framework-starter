name: Phase 4 E2E Tests

on:
  push:
  pull_request:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-quality-engineering-framework

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install chromium

      - name: Run deterministic Phase 4 airline E2E tests
        run: |
          python -m pytest -m e2e -v --html=reports/airline-e2e-report.html --self-contained-html

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airline-e2e-test-report
          path: ai-quality-engineering-framework/reports/
